# Render Blueprint: the API (backend/) and its PostgreSQL database.
# Dashboard: New > Blueprint > pick this repository > Apply.
#
# Runs with NODE_ENV=staging: rate limiting, secure cookies and admin 2FA are on, Swagger is
# served at /docs, and sign-up works without an email service. Production mode additionally
# requires an email provider (Resend), field-encryption keys and HTTPS frontend origins; see
# backend/apps/api/.env.example and backend/docs/DEPLOYMENT_SECURITY.md before switching.
#
# No secrets live in this file: BETTER_AUTH_SECRET is generated by Render.

databases:
  - name: pregnancy-care-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: preconception
    user: preconception
    # Reachable only from Render services in the same region (no public access).
    ipAllowList: []

services:
  - type: web
    name: pregnancy-care-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend
    dockerfilePath: ./backend/apps/api/Dockerfile.render
    healthCheckPath: /v1/health
    autoDeployTrigger: commit
    # Only redeploy when the backend changes, not for frontend-only commits.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: pregnancy-care-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # The service's public address. If Render assigns a different subdomain (the name is
      # taken), update this in the dashboard to match the URL shown on the service page.
      - key: BETTER_AUTH_URL
        value: https://pregnancy-care-api.onrender.com
      # The website's origin. Change both to the deployed frontend's https URL when it exists.
      - key: APP_URL
        value: http://localhost:3000
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: ADMIN_REQUIRE_MFA
        value: "true"
      - key: EMAIL_PROVIDER
        value: none
      # Render's load balancer sits in front of the API (one trusted hop).
      - key: TRUST_PROXY
        value: "1"
