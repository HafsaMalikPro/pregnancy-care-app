name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, migrate, test, coverage, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: preconception
          POSTGRES_PASSWORD: preconception_ci
          POSTGRES_DB: preconception
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U preconception"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Synthetic CI database only. The e2e suite refuses to run unless TEST_DATABASE_URL
      # names its database explicitly (test/db-safety.ts).
      DATABASE_URL: postgresql://preconception:preconception_ci@localhost:5432/preconception
      TEST_DATABASE_URL: postgresql://preconception:preconception_ci@localhost:5432/preconception
      NODE_ENV: test
      # Throwaway value for the CI app instance only; real secrets come from the secret store.
      BETTER_AUTH_SECRET: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      # Lint and typecheck build the shared packages they depend on first (turbo ^build).
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Validate Prisma schema
        run: pnpm --filter @preconception/api exec prisma validate

      - name: Apply migrations to a clean test database
        run: pnpm --filter @preconception/api exec prisma migrate deploy
      - name: Check schema and migrations are in sync
        run: pnpm --filter @preconception/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Unit tests
        run: pnpm test
      # Integration and end-to-end tests run against the real app and PostgreSQL, together
      # with the unit tests for one combined coverage report. Fails below 80% statements,
      # branches, functions or lines.
      - name: Integration and E2E tests with coverage
        run: pnpm --filter @preconception/api test:coverage
      - name: Coverage summary
        if: always()
        run: |
          f=apps/api/coverage/all/coverage-summary.json
          if [ -f "$f" ]; then
            node -e "const t=require('./$f').total; console.log('| Metric | % |\n|---|---|'); for (const k of ['statements','branches','functions','lines']) console.log('| '+k+' | '+t[k].pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage/all
          if-no-files-found: ignore

      - name: Production build
        run: pnpm build

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Dependency audit (high and critical)
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
